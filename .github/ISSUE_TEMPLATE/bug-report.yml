name: Bug report
description: Report a reproducible dictation, model, installation, or update problem
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include recordings, private conversation text, credentials, or account identifiers.
  - type: input
    id: plugin_version
    attributes:
      label: Plugin version
      description: Copy the exact installed version.
    validations:
      required: true
  - type: input
    id: dsh_version
    attributes:
      label: DSH version
      description: Copy the exact version shown by your installation.
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Recognition source
      options:
        - SenseVoice
        - Paraformer
        - Nemotron 3.5
        - Codex global dictation
        - Installation or settings
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the shortest sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized screenshots or output
      description: Remove private text and identifiers before attaching evidence.
  - type: checkboxes
    id: safety
    attributes:
      label: Before submitting
      options:
        - label: I checked that this report contains no recordings, private conversation text, credentials, or account identifiers.
          required: true
