name: Feature request
description: Suggest a focused improvement to editable dictation in DSH
labels:
  - enhancement
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What are you trying to dictate, and which recognition source are you using?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe the smallest interaction and outcome that would solve the need.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Explain your current workaround or link a public example.
